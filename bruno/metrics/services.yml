info:
  name: Per-service summary
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/projects/{{projectId}}/metrics/services"

runtime:
  scripts:
    - type: tests
      code: |-
        const items = Object.fromEntries(res.getBody().items.map((s) => [s.service_name, s]));
        test("three services with exact counts", function () {
          expect(items.payments.events).to.equal(3);
          expect(items.payments.error_rate).to.equal(0.5);
          expect(items.search.errors).to.equal(1);
          expect(items["checkout-api"].request_errors).to.equal(1);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
