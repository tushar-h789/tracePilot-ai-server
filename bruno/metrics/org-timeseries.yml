info:
  name: Organization timeseries
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/organizations/{{orgId}}/metrics/timeseries"

runtime:
  scripts:
    - type: tests
      code: |-
        // 9 = the 8 seeded events + the one valid event stored by ingest/invalid-stored-nothing.
        test("sums to the org total", function () {
          expect(res.getBody().points.reduce((s, p) => s + p.events, 0)).to.equal(9);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
