info:
  name: Ingest a batch (202)
  type: http
  seq: 1
  tags:
    - smoke

http:
  method: POST
  url: "{{baseUrl}}/ingest/logs"
  headers:
    - name: Authorization
      value: "Bearer {{ingestKey}}"
  body:
    type: json
    data: |-
      {
        "events": [
          {
            "event_id": "{{eventId1}}",
            "timestamp": "{{nowIso}}",
            "level": "error",
            "service_name": "checkout-api",
            "message": "POST /api/checkout failed: database query timed out",
            "http_method": "POST",
            "http_path": "/api/checkout",
            "http_status": 504,
            "duration_ms": 5012.5,
            "trace_id": "4bf92f3577b34da6a3ce929d0e0e4736",
            "attributes": {"synthetic": true, "source": "bruno", "password": "hunter2"}
          },
          {
            "event_id": "{{eventId2}}",
            "timestamp": "{{nowIso}}",
            "level": "info",
            "service_name": "checkout-api",
            "message": "GET /api/cart 200"
          }
        ]
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const run = String(bru.getVar("runId")).padStart(12, "0").slice(-12);
        bru.setVar("eventId1", "e0000000-0000-4000-8000-" + run);
        bru.setVar("eventId2", "e0000000-0000-4000-8001-" + run);
        bru.setVar("nowIso", new Date().toISOString());
    - type: tests
      code: |-
        test("all events accepted", function () {
          expect(res.getBody()).to.deep.equal({ received: 2, accepted: 2, duplicates: 0, rejected: 0 });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 10000
