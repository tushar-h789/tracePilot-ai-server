info:
  name: List my sessions
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/auth/sessions"

runtime:
  scripts:
    - type: after-response
      code: |-
        const current = (res.getBody().items || []).find((s) => s.current);
        if (current) bru.setVar("currentSessionId", current.id);
    - type: tests
      code: |-
        test("lists active sessions with exactly one current", function () {
          const items = res.getBody().items;
          expect(items).to.be.an("array").that.is.not.empty;
          expect(items.filter((s) => s.current)).to.have.length(1);
          expect(JSON.stringify(items)).to.not.include("token");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 5000
