info:
  name: Current user after logout (401)
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/auth/me"

runtime:
  scripts:
    - type: tests
      code: |-
        test("revoked session is rejected with a problem document", function () {
          expect(res.getHeader("content-type")).to.include("application/problem+json");
          expect(res.getBody().code).to.equal("not_authenticated");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 5000
