info:
  name: List projects (archived hidden)
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/organizations/{{orgId}}/projects"

runtime:
  scripts:
    - type: tests
      code: |-
        test("only the active project is listed", function () {
          const ids = res.getBody().items.map((p) => p.id);
          expect(ids).to.deep.equal([bru.getVar("projectId")]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
