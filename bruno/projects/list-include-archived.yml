info:
  name: List projects (include archived, paginated)
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/organizations/{{orgId}}/projects?include_archived=true&limit=1"

runtime:
  scripts:
    - type: tests
      code: |-
        test("newest first, one per page, with a cursor", function () {
          const body = res.getBody();
          expect(body.items).to.have.length(1);
          expect(body.items[0].id).to.equal(bru.getVar("projectId2"));
          expect(body.next_cursor).to.be.a("string");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
