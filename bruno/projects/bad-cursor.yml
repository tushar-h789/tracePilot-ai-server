info:
  name: List projects with a forged cursor (422)
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/organizations/{{orgId}}/projects?cursor=not-a-cursor"

runtime:
  scripts:
    - type: tests
      code: |-
        test("invalid cursors are rejected", function () {
          expect(res.getBody().code).to.equal("validation_failed");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 10000
