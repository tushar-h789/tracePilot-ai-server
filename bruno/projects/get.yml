info:
  name: Get project
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/projects/{{projectId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the project", function () {
          expect(res.getBody().id).to.equal(bru.getVar("projectId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
