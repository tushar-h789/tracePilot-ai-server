info:
  name: List ingestion keys (metadata only)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/projects/{{projectId}}/ingestion-keys"

runtime:
  scripts:
    - type: tests
      code: |-
        test("prefix and timestamps only, no secret or hash", function () {
          const body = res.getBody();
          expect(body.items).to.have.length(1);
          const key = body.items[0];
          expect(key.prefix).to.match(/^tp_[0-9a-f]{12}$/);
          expect(key).to.have.property("last_used_at");
          expect(key).to.not.have.property("secret");
          expect(key).to.not.have.property("key_hash");
          expect(JSON.stringify(body)).to.not.include(bru.getVar("ingestKey"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
