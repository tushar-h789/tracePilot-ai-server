info:
  name: Change member role to admin
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/organizations/{{orgId}}/members/{{memberUserId}}"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "role": "admin"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("role updated", function () {
          expect(res.getBody().role).to.equal("admin");
          expect(res.getBody().user_id).to.equal(bru.getVar("memberUserId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 5000
