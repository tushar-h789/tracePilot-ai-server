info:
  name: Audit log (owner)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/organizations/{{orgId}}/audit-logs"

runtime:
  scripts:
    - type: tests
      code: |-
        test("records org and membership events without secrets", function () {
          const actions = res.getBody().items.map((e) => e.action);
          for (const a of ["org.created", "org.member_added", "org.member_role_changed", "org.member_removed"]) {
            expect(actions).to.include(a);
          }
          expect(JSON.stringify(res.getBody())).to.not.match(/password|tp_session|csrf/i);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 5000
