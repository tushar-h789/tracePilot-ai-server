info:
  name: Outsider reads org metrics summary (404)
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/organizations/{{orgId}}/metrics/summary"

runtime:
  scripts:
    - type: tests
      code: |-
        test("no existence leak", function () {
          expect(res.getBody().detail).to.equal("Organization not found.");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 10000
