info:
  name: Outsider reads owner project (404)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/projects/{{projectId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("not found, no existence leak", function () {
          expect(res.getBody().detail).to.equal("Project not found.");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 10000
