info:
  name: Login as outsider (other tenant)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: X-CSRF-Token
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "email": "bruno-outsider-{{runId}}@{{emailDomain}}",
        "password": "{{demoPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const sc = res.getHeader("set-cookie");
        const list = Array.isArray(sc) ? sc : sc ? [sc] : [];
        const csrf = list.find((v) => v.startsWith("tp_csrf="));
        if (csrf) bru.setVar("csrfToken", csrf.split(";")[0].slice("tp_csrf=".length));
    - type: tests
      code: |-
        test("outsider logged in", function () {
          expect(res.getBody().user.id).to.not.equal(bru.getVar("ownerUserId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 5000
