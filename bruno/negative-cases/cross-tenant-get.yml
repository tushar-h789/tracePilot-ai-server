info:
  name: Outsider reads owner org (404)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/organizations/{{orgId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("not found, no existence leak", function () {
          expect(res.getBody().detail).to.equal("Organization not found.");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 5000
