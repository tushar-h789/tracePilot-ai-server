info:
  name: Get organization
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/organizations/{{orgId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the org with my role", function () {
          expect(res.getBody().id).to.equal(bru.getVar("orgId"));
          expect(res.getBody().role).to.equal("owner");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 5000
