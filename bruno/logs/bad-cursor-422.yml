info:
  name: Forged cursor (422)
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/projects/{{projectId}}/logs?cursor=not-a-cursor"

runtime:
  scripts:
    - type: tests
      code: |-
        test("validation problem", function () {
          expect(res.getBody().code).to.equal("validation_failed");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 10000
