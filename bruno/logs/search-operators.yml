info:
  name: Search with tsquery operators is safe
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/projects/{{projectId}}/logs?q=%27%26%7C%21()%3A*"

runtime:
  scripts:
    - type: tests
      code: |-
        // 9 = the 8 seeded events + the one valid event stored by ingest/invalid-stored-nothing.
        test("punctuation-only search is no filter (all 9)", function () {
          expect(res.getBody().items.length).to.equal(9);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: false
  timeout: 10000
