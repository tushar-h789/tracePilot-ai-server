info:
  name: Filter by level=error,critical
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/projects/{{projectId}}/logs?level=error&level=critical"

runtime:
  scripts:
    - type: tests
      code: |-
        const items = res.getBody().items;
        test("3 error-level events", function () {
          expect(items.length).to.equal(3);
          items.forEach((i) => expect(["error", "critical"]).to.include(i.level));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
