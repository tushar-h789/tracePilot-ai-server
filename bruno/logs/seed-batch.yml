info:
  name: Ingest a known batch for log queries (202)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/ingest/logs"
  headers:
    - name: Authorization
      value: "Bearer {{ingestKey}}"
  body:
    type: json
    data: |-
      {
        "events": [
          {"event_id": "{{seedId}}1", "timestamp": "{{ts1}}", "level": "error", "service_name": "payments",
           "message": "card declined brunotoken{{runId}}", "http_method": "POST", "http_path": "/pay",
           "http_status": 502, "duration_ms": 120, "trace_id": "{{traceId}}", "request_id": "req-{{runId}}",
           "attributes": {"synthetic": true, "source": "bruno", "card": {"brand": "visa"}}},
          {"event_id": "{{seedId}}2", "timestamp": "{{ts2}}", "level": "info", "service_name": "payments",
           "message": "charge ok", "http_method": "POST", "http_path": "/pay", "http_status": 200,
           "duration_ms": 40, "trace_id": "{{traceId}}"},
          {"event_id": "{{seedId}}3", "timestamp": "{{ts3}}", "level": "warning", "service_name": "search",
           "message": "slow query", "http_method": "GET", "http_path": "/search", "http_status": 200,
           "duration_ms": 900},
          {"event_id": "{{seedId}}4", "timestamp": "{{ts4}}", "level": "critical", "service_name": "search",
           "message": "index corrupted brunotoken{{runId}}"},
          {"event_id": "{{seedId}}5", "timestamp": "{{ts5}}", "level": "debug", "service_name": "payments",
           "message": "cache hit"},
          {"event_id": "{{seedId}}6", "timestamp": "{{ts6}}", "level": "info", "service_name": "search",
           "message": "GET /search 200", "http_method": "GET", "http_path": "/search", "http_status": 200,
           "duration_ms": 30}
        ]
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const run = String(bru.getVar("runId")).padStart(12, "0").slice(-12);
        // event ids e0000000-0000-4000-8100-<11 run digits><n>
        bru.setVar("seedId", "e0000000-0000-4000-8100-" + run.slice(-11));
        bru.setVar("traceId", "b" + run.padStart(31, "0"));
        const now = Date.now();
        for (let i = 1; i <= 6; i++) bru.setVar("ts" + i, new Date(now - i * 1000).toISOString());
    - type: tests
      code: |-
        test("6 accepted", function () {
          expect(res.getBody().accepted).to.equal(6);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 10000
