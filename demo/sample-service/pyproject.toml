[project]
name = "tracepilot-demo-sample-service"
version = "0.1.0"
description = "Synthetic, deterministic demo traffic for TracePilot AI (uses tracepilot-sdk)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tracepilot-sdk"]

[project.scripts]
tracepilot-demo = "sample_service.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_service"]

[tool.uv.sources]
tracepilot-sdk = { path = "../../packages/python-sdk", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "C4", "RUF", "PT", "BLE"]
# S311: `random` is used on purpose — reproducible synthetic data, not security.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["sample_service"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
