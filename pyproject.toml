[project]
name = "tracepilot-ai-server"
version = "0.1.0"
description = "TracePilot AI — API, worker and migrations (FastAPI, Celery, Alembic)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=6.4.0",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "celery-types>=0.26.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["bruno"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "C4", "RUF", "ASYNC", "PT", "T20", "BLE"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"scripts/**" = ["T201"]
"demo/**" = ["T201", "S311"]
"migrations/versions/**" = ["F401"]
"app/services/health.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["app", "migrations", "scripts", "tests", "demo/sample-service"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs real Postgres + Redis (TEST_DATABASE_URL / TEST_REDIS_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
